[Service]
# --skip-login --noissue hides the tty1 banner and "login: user (automatic login)".
# Leave the VT allocated so Plymouth's retained splash stays until labwc starts.
ExecStart=
ExecStart=-/sbin/agetty --skip-login --nonewline --noissue --autologin __KIOSK_USER__ --noclear %I $TERM
Type=idle
TTYVTDisallocate=no
